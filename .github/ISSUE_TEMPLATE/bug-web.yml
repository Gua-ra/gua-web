name: Bug report for Gua for Web
description: Report a problem with Gua in a web browser like Firefox, Chrome, Edge, and so on.
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to fill out this bug report!

              Do not report security problems here. Follow [SECURITY.md](https://github.com/Gua-ra/gua-web/blob/gua/main/SECURITY.md) instead.
    - type: textarea
      id: reproduction-steps
      attributes:
          label: Steps to reproduce
          description: Please attach screenshots, videos or logs if you can.
          placeholder: Tell us what you see!
          value: |
              1. Where are you starting? What can you see?
              2. What do you click?
              3. More steps…
      validations:
          required: true
    - type: textarea
      id: result
      attributes:
          label: Outcome
          placeholder: Tell us what went wrong
          value: |
              #### What did you expect?

              #### What happened instead?
      validations:
          required: true
    - type: input
      id: os
      attributes:
          label: Operating system
          placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
      validations:
          required: false
    - type: input
      id: browser
      attributes:
          label: Browser information
          description: Which browser and version are you using?
          placeholder: e.g. Firefox 130, Chrome 128
      validations:
          required: false
    - type: input
      id: webapp-url
      attributes:
          label: URL
          description: Which URL are you using to open Gua? If it is your own deployment, say which version you run.
          placeholder: e.g. https://chat.example.org
      validations:
          required: false
    - type: input
      id: version
      attributes:
          label: Application version
          description: Shown under Settings > Help & About.
          placeholder: e.g. 1.11.110
      validations:
          required: false
