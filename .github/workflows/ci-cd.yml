name: CI/CD

# Deploys:
#   - a PR labelled `deploy:dev` builds that branch and rolls it onto dev. Re-add the label to redeploy.
#   - a merge to gua/main deploys dev and stages prod for approval.
#   - workflow_dispatch does either by hand.
on:
    push:
        branches: ["gua/main"]
    pull_request:
        types: [opened, synchronize, reopened, labeled]
    workflow_dispatch:
        inputs:
            environment:
                description: "Target environment for manual deploy"
                type: choice
                options: [dev, prod]
                default: dev

permissions:
    contents: read
    packages: write
    pull-requests: write

env:
    IMAGE: ghcr.io/gua-ra/gua-web
    # Only people with write access can add labels, which is what gates PR deploys.
    DEPLOY_LABEL: deploy:dev

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            ref: ${{ steps.ref.outputs.ref }}
            deploy-to-dev: ${{ steps.gate.outputs.dev }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # docker-package.sh reads the version from git history.
                  fetch-depth: 0

            - id: gate
              name: Decide whether this PR asked for a dev deploy
              # A PR from a fork has no registry credentials, so it never deploys.
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ] \
                     && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] \
                     && ${{ contains(github.event.pull_request.labels.*.name, 'deploy:dev') }}; then
                    echo "dev=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "dev=false" >> "$GITHUB_OUTPUT"
                  fi

            - id: ref
              run: echo "ref=${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

            # An unlabelled PR skips the image build. Build and Tests already cover it.
            - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
            - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
              id: meta
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=sha,format=long
                      type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/gua/main' }}
                      type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
            - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy-dev:
        needs: build
        if: >-
            (github.event_name == 'push' && github.ref == 'refs/heads/gua/main') ||
            (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') ||
            needs.build.outputs.deploy-to-dev == 'true'
        runs-on: [self-hosted, gua-web-incluster]
        environment: dev
        steps:
            - name: Roll out ${{ needs.build.outputs.ref }} to dev
              run: |
                  IMG="${{ needs.build.outputs.ref }}"
                  # The deployment is not defined in this repo, so read its container name.
                  CONTAINER="$(kubectl -n gua get deployment gua-web -o jsonpath='{.spec.template.spec.containers[0].name}')"
                  kubectl -n gua set image deployment/gua-web "${CONTAINER}=${IMG}"
                  kubectl -n gua rollout status deployment/gua-web --timeout=180s

            - name: Tell the PR where it went
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `Deployed to **dev** (ns \`gua\`): \`${{ needs.build.outputs.ref }}\`\n\nDev keeps running this build until something else is deployed over it. Merging to gua/main returns dev to gua/main's build.`
                      })

    # The production environment requires a reviewer, so this waits for approval.
    deploy-prod:
        needs: build
        if: >-
            (github.event_name == 'push' && github.ref == 'refs/heads/gua/main') ||
            (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
        runs-on: [self-hosted, gua-web-incluster-prod]
        environment: production
        steps:
            - name: Roll out ${{ needs.build.outputs.ref }} to prod
              run: |
                  IMG="${{ needs.build.outputs.ref }}"
                  CONTAINER="$(kubectl -n gua-prod get deployment gua-web -o jsonpath='{.spec.template.spec.containers[0].name}')"
                  kubectl -n gua-prod set image deployment/gua-web "${CONTAINER}=${IMG}"
                  kubectl -n gua-prod rollout status deployment/gua-web --timeout=180s
