name: CI/CD

on:
  push:
    branches: ["gua/main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for manual deploy"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gua-ra/gua-web

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # docker-package.sh derives the webapp version from git history and
          # tags inside the image build, so it needs the full history.
          fetch-depth: 0
      # The Dockerfile is self-contained: its builder stage runs yarn install
      # and the webapp build, so no host-side node or yarn setup is needed.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        run: echo "ref=${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/gua/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # AUTOMATIC on push to gua/main; also manually dispatchable (environment=dev)
  # to roll any branch onto dev for QA.
  # The deploy runner manifest lives in gua-deploy under
  # k8s/cicd/gua-web-deploy-runner.yaml and must be registered before deploys
  # can run.
  deploy-dev:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/gua/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: [self-hosted, gua-web-incluster]
    environment: dev
    steps:
      - name: Roll out ${{ needs.build.outputs.ref }} to dev
        run: |
          IMG="${{ needs.build.outputs.ref }}"
          # deployment/gua-web was created out of band, so its container name is
          # not recorded in any manifest in this repo. Resolve it at runtime
          # instead of hardcoding a guess that could silently drift.
          CONTAINER="$(kubectl -n gua get deployment gua-web -o jsonpath='{.spec.template.spec.containers[0].name}')"
          kubectl -n gua set image deployment/gua-web "${CONTAINER}=${IMG}"
          kubectl -n gua rollout status deployment/gua-web --timeout=180s

  # Staged on every push to gua/main and manually dispatchable with
  # environment=prod. The production GitHub Environment has a required reviewer
  # and a gua/main branch policy, so staged runs pause here until approved.
  deploy-prod:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/gua/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    runs-on: [self-hosted, gua-web-incluster-prod]
    environment: production
    steps:
      - name: Roll out ${{ needs.build.outputs.ref }} to prod
        run: |
          IMG="${{ needs.build.outputs.ref }}"
          # Same runtime container name resolution as dev, the prod deployment
          # was also created out of band.
          CONTAINER="$(kubectl -n gua-prod get deployment gua-web -o jsonpath='{.spec.template.spec.containers[0].name}')"
          kubectl -n gua-prod set image deployment/gua-web "${CONTAINER}=${IMG}"
          kubectl -n gua-prod rollout status deployment/gua-web --timeout=180s
