name: Pull Request Base Branch
on:
    pull_request:
        types: [opened, edited, synchronize]
permissions: {} # No permissions required
jobs:
    check_base_branch:
        name: Check PR base branch
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
              with:
                  # Gua work lands on gua/main. develop, staging and master mirror upstream Element,
                  # so a PR into one of them is aimed at the wrong branch.
                  script: |
                      const baseBranch = context.payload.pull_request.base.ref;
                      if (["develop", "staging", "master"].includes(baseBranch)) {
                          core.setFailed(`Invalid base branch: ${baseBranch}, Gua PRs target gua/main`);
                      }
